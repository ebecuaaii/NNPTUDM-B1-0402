<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-box-seam me-2"></i>Product Dashboard</a>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <!-- Controls Section -->
        <div class="card shadow-sm mb-4 border-0 rounded-4">
            <div class="card-body p-4">
                <div class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i
                                    class="bi bi-search text-muted"></i></span>
                            <input type="text" id="searchInput" class="form-control border-start-0 ps-0"
                                placeholder="Search by title...">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <select id="pageSizeSelect" class="form-select">
                            <option value="5">5 items/page</option>
                            <option value="10" selected>10 items/page</option>
                            <option value="20">20 items/page</option>
                        </select>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <div class="btn-group me-2">
                            <button class="btn btn-outline-secondary" onclick="handleSort('price')"><i
                                    class="bi bi-sort-numeric-down"></i> Sort Price</button>
                            <button class="btn btn-outline-secondary" onclick="handleSort('title')"><i
                                    class="bi bi-sort-alpha-down"></i> Sort Title</button>
                        </div>
                        <button class="btn btn-success me-2" onclick="exportToCSV()"><i
                                class="bi bi-file-earmark-excel"></i> Export CSV</button>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createProductModal"><i
                                class="bi bi-plus-lg"></i> New Product</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="productsTable">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Items rendered here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-0 py-3 rounded-bottom-4">
                <nav>
                    <ul class="pagination justify-content-center mb-0" id="pagination">
                        <!-- Pagination items -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal fade" id="productDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="detailTitle">Product Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row">
                        <div class="col-md-5">
                            <div id="detailCarousel" class="carousel slide rounded-3 overflow-hidden shadow-sm"
                                data-bs-ride="carousel">
                                <div class="carousel-inner" id="detailImages">
                                    <!-- Images injected here -->
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#detailCarousel"
                                    data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#detailCarousel"
                                    data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <h4 id="detailProductName" class="fw-bold mb-3"></h4>
                            <span class="badge bg-info bg-opacity-10 text-info mb-3 fs-6" id="detailCategory"></span>
                            <h3 class="text-primary fw-bold mb-3" id="detailPrice"></h3>
                            <p class="text-muted" id="detailDescription"></p>
                            <div class="mt-4 pt-3 border-top">
                                <button class="btn btn-warning w-100" id="btnOpenEdit"><i class="bi bi-pencil"></i> Edit
                                    Product</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Product Modal -->
    <div class="modal fade" id="createProductModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Create New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createForm">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" name="price" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category ID</label>
                            <input type="number" class="form-control" name="categoryId" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" name="images" required
                                placeholder="https://placeimg.com/640/480/any">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create Product</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Product Modal -->
    <div class="modal fade" id="editProductModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Edit Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" name="id" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" name="title" id="editTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" name="price" id="editPrice" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label> <!-- Fixed Typo -->
                            <textarea class="form-control" name="description" id="editDescription" rows="3"
                                required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" name="images" id="editImage" required
                                placeholder="https://placeimg.com/640/480/any">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Update Product</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
